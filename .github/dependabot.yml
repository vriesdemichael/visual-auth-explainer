version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Goes with the CI image and the screenshot baselines, so it is updated by hand with them.
      - dependency-name: '@playwright/test'
