name: Breakages

# Breaks the code on purpose and checks that a test notices. Not on pull requests, because it runs the
# tests once for each breakage (ADR-006).
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: run
        shell: bash
        run: pnpm test:breakages 2>&1 | tee breakages.txt
      - if: failure() && steps.run.conclusion == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="A deliberate breakage went unnoticed"
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            grep -E '^(Unnoticed|No longer applies|The tests fail)|noticed,' breakages.txt
            echo '```'
          } > body.md
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
