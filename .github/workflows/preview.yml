name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  deployments: read
  pull-requests: write

jobs:
  preview:
    # Forks cannot write to gh-pages.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - run: pnpm build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}
      # The deploy action never deletes these, so they would outlive the preview.
      # The one at the root of gh-pages covers the whole site.
      - run: find build -name .nojekyll -delete
        if: github.event.action != 'closed'
      - uses: rossjrw/pr-preview-action@v1
        id: preview
        with:
          source-dir: build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false
          wait-for-pages-deployment: true
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        if: steps.preview.outputs.deployment-action == 'deploy'
        with:
          header: preview
          message: |
            Preview of ${{ github.event.pull_request.head.sha }}:

            - [Site](${{ steps.preview.outputs.preview-url }})
            - [Storybook](${{ steps.preview.outputs.preview-url }}storybook/)
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        if: steps.preview.outputs.deployment-action == 'remove'
        with:
          header: preview
          message: The preview was removed when this pull request closed.
