name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# By pull request: on a merged close github.ref is main, so every close would share one group,
# and the ones waiting get cancelled, which leaves their previews up for good.
concurrency: preview-${{ github.event.number }}

permissions:
  contents: write
  deployments: read
  pull-requests: write

jobs:
  preview:
    # Forks and Dependabot get a read-only token, so they cannot write to gh-pages.
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - run: pnpm build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}
      # The deploy action never deletes these, so they would outlive the preview.
      # The one at the root of gh-pages covers the whole site.
      - run: find build -name .nojekyll -delete
        if: github.event.action != 'closed'
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        id: preview
        with:
          source-dir: build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false
          # Not waiting for Pages: when two previews deploy within seconds, Pages abandons the older
          # build and the newer one includes both, so that job would go red for nothing.
          wait-for-pages-deployment: false
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.preview.outputs.deployment-action == 'deploy'
        with:
          header: preview
          message: |
            Preview of ${{ github.event.pull_request.head.sha }}:

            - [Site](${{ steps.preview.outputs.preview-url }})
            - [Storybook](${{ steps.preview.outputs.preview-url }}storybook/)
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.preview.outputs.deployment-action == 'remove'
        with:
          header: preview
          message: The preview was removed when this pull request closed.
