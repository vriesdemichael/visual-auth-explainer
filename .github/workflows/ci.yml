name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # By pull request, because a branch name is not unique: a fork can use the same one.
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: CI Complete
    runs-on: ubuntu-latest
    # The screenshot baselines come from this image. Keep its version the same as @playwright/test.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # A container runs as another user than the one who checked out, which git refuses by default.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:unit
      - run: pnpm test:e2e
        env:
          # Firefox will not run as root with a HOME that belongs to someone else, which is what a
          # container job gets.
          HOME: /root
          # Only production may be indexed, and only once the repository variable says so.
          VITE_INDEXABLE: ${{ github.event_name == 'push' && vars.ALLOW_INDEXING == 'true' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      # The build the click-through just tested is the one that goes live.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: pages
          path: build/
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pages
          path: build
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: build
          branch: gh-pages
          # Pull request previews live on the same branch and are not this job's to remove,
          # and one may be pushing at the same moment, so rebase on it and do not overwrite it.
          clean-exclude: pr-preview/
          force: false
      - run: node tests/support/check-live.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" "${{ github.sha }}"
