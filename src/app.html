<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<script>
			(function () {
				// An address with a doubled slash or index.html serves a real file, but relative links on it
				// break and no route matches it, so go to the address it means.
				var path = location.pathname;
				var meant = path.replace(/\/{2,}/g, '/').replace(/\/index\.html$/, '/');
				if (meant !== path) location.replace(meant + location.search + location.hash);

				// The prerendered page shows the default state. A link with settings should not flash it.
				if (location.search) document.documentElement.classList.add('pending');

				// If the application never starts, say so, and show what is here rather than nothing.
				function notStarted() {
					var root = document.documentElement;
					if (root.hasAttribute('data-started') || root.hasAttribute('data-not-started')) return;
					root.setAttribute('data-not-started', '');
					root.classList.remove('pending');
					var note = document.createElement('p');
					note.setAttribute('role', 'alert');
					note.setAttribute('data-testid', 'not-started');
					note.className = 'not-started';
					note.textContent =
						'The interactive part did not load, so this is only the start of this page and nothing on it will respond. ';
					var again = document.createElement('a');
					again.href = location.href;
					again.textContent = 'Try again';
					note.appendChild(again);
					document.body.prepend(note);
				}
				addEventListener('unhandledrejection', notStarted);
				setTimeout(notStarted, 15000);
			})();
		</script>
		%sveltekit.head%
		<title>Authlines</title>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<p class="not-started" data-testid="no-javascript">
				This application needs JavaScript to step through a flow. Without it, a page shows where
				that flow starts, and the <a href="%sveltekit.assets%/">map</a> still lists every question.
			</p>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
